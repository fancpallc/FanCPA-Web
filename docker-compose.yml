services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY_TARGET=http://backend:8788
    depends_on:
      - backend
    networks:
      - fancpa-net

  backend:
    # Use node:20 (debian) not alpine because workerd needs glibc
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
      - backend_nm:/app/node_modules
      - ./.wrangler:/app/.wrangler
    ports:
      - "8788:8788"
    command: sh -c "npm install --no-audit --no-fund && npm run build && npx wrangler pages dev dist --local --ip 0.0.0.0 --port 8788 --compatibility-date=2024-01-01"
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=local
    networks:
      - fancpa-net

  tests:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - FORCE_COLOR=0
      - NO_COLOR=1
    # Fail-loud, success-quiet: lint/build logs only shown on failure; tests use dot reporter and silenced !!! traces
    # Uses YAML literal block to preserve newlines — previous double-quoted multiline collapsed to spaces, merging set -e and set -o pipefail into one broken builtin.
    command:
      - sh
      - -c
      - |
        set -e
        set -o pipefail
        npm ci --silent --no-audit --no-fund
        npm run lint --silent
        echo '[lint ok]'
        (npm run build --silent > /tmp/build.log 2>&1 && echo '[build ok]' || (cat /tmp/build.log && exit 1))
        npm test -- --run --reporter=dot 2>&1 | grep -E 'Test Files|Tests|passed|failed|RUN|·+|\.+|Duration' | grep -v 'was not wrapped in act'
        npm run test:workers -- --run --reporter=dot 2>&1 | grep -E 'Test Files|Tests|passed|failed|RUN|·+|\.+|Duration'
    networks:
      - fancpa-net
    profiles:
      - test

networks:
  fancpa-net:
    driver: bridge

volumes:
  backend_nm:
