services:
  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY_TARGET=http://backend:8788
    depends_on:
      - backend
    networks:
      - fancpa-net

  backend:
    # Use node:20 (debian) not alpine because workerd needs glibc
    image: node:20
    working_dir: /app
    volumes:
      - .:/app
      - backend_nm:/app/node_modules
      - ./.wrangler:/app/.wrangler
    ports:
      - "8788:8788"
    command: sh -c "npm install --no-audit --no-fund && npm run build && npx wrangler pages dev dist --local --ip 0.0.0.0 --port 8788 --compatibility-date=2024-01-01"
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=local
    networks:
      - fancpa-net

  tests:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install --no-audit --no-fund && npm test && npm run test:workers"
    networks:
      - fancpa-net
    profiles:
      - test

networks:
  fancpa-net:
    driver: bridge

volumes:
  backend_nm:
